name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/secure-user-app

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastapi_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fastapi_db

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: pytest tests/unit -v

      - name: Integration tests (Postgres)
        run: pytest tests/integration -v

      - name: Full suite with coverage
        run: pytest --cov=app --cov-report=term-missing

  build-scan-deploy:
    needs: test
    runs-on: ubuntu-latest
    # Only push images for commits that land on main, never for pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image locally for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan

      - name: Scan image with Trivy
        # 0.35.0 is the release published after the March 2026 tag compromise
        uses: aquasecurity/trivy-action@0.35.0
        continue-on-error: true
        with:
          version: v0.69.3
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Smoke-test the container
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e DATABASE_URL=sqlite:////tmp/smoke.db \
            ${{ env.IMAGE_NAME }}:scan
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          docker logs smoke
          exit 1

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
